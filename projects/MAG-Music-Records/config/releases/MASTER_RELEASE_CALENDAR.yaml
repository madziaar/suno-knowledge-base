# -----------------------------------------------------------------------------
# SCHEMA DEFINITION
# -----------------------------------------------------------------------------
# All releases MUST conform to this schema for automation compatibility

schema:
  version: "1.0.0"

  release_entry:
    required_fields:
      - id              # Unique identifier (string, format: REL-YYYY-NNN)
      - type            # Release type (enum: single, ep, album, remix, feature)
      - project         # Project ID (string, must match SOURCE_OF_TRUTH)
      - track           # Track reference or "all" for full releases
      - target_date     # ISO 8601 date (YYYY-MM-DD)
      - status          # Current status (enum: see status_values)
      - priority        # Priority level (enum: P0, P1, P2, P3)

    optional_fields:
      - title           # Release title (string, max 100 chars)
      - description     # Release description (string, max 500 chars)
      - dependencies    # List of release IDs this depends on
      - blockers        # List of current blockers
      - platforms       # Target platforms list
      - marketing       # Marketing campaign ID
      - artwork         # Artwork asset reference
      - assigned_to     # Team member or agent responsible
      - notes           # Internal notes
      - created_at      # ISO 8601 datetime
      - updated_at      # ISO 8601 datetime

    status_values:
      - planned         # Scheduled, not started
      - in_progress     # Actively being worked on
      - review          # Under review/approval
      - ready           # Approved, awaiting release date
      - released        # Successfully released
      - delayed         # Pushed back from original date
      - cancelled       # No longer planned
      - blocked         # Cannot proceed due to blockers

    type_values:
      - single          # Individual track release
      - lead_single     # First single from larger project
      - ep              # Extended play (3-6 tracks)
      - album           # Full album release
      - remix           # Remix release
      - feature         # Featured collaboration
      - deluxe          # Deluxe/expanded edition

# -----------------------------------------------------------------------------
# PRIORITY CALCULATION RULES
# -----------------------------------------------------------------------------
# Priority is calculated based on days until target_date
# Lower number = higher priority

priority_rules:
  calculation_method: "days_until_release"

  levels:
    P0:
      name: "Critical"
      description: "Immediate attention required"
      days_range: [0, 7]        # 0-7 days out
      color: "#FF0000"          # Red
      escalation: true
      check_frequency: "daily"

    P1:
      name: "High"
      description: "Active focus required"
      days_range: [8, 14]       # 8-14 days out
      color: "#FFA500"          # Orange
      escalation: false
      check_frequency: "every_2_days"

    P2:
      name: "Medium"
      description: "On track, regular monitoring"
      days_range: [15, 30]      # 15-30 days out
      color: "#FFFF00"          # Yellow
      escalation: false
      check_frequency: "weekly"

    P3:
      name: "Low"
      description: "Planning phase, no urgency"
      days_range: [31, null]    # 31+ days out
      color: "#00FF00"          # Green
      escalation: false
      check_frequency: "bi_weekly"

  overrides:
    # These conditions override calculated priority
    - condition: "has_unresolved_blockers"
      set_priority: "P0"
      reason: "Blockers require immediate resolution"

    - condition: "dependencies_not_met"
      set_priority: "P1"
      reason: "Dependencies must be resolved before release"

    - condition: "status == 'delayed'"
      add_priority: 1           # Increase priority by 1 level
      reason: "Delayed releases need extra attention"

