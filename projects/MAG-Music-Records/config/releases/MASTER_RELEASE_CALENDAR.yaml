# -----------------------------------------------------------------------------
# AUTOMATION HOOKS
# -----------------------------------------------------------------------------
# Events that trigger automated actions

automation:

  on_priority_change:
    - action: "notify"
      condition: "new_priority == 'P0'"
      message: "Release {id} is now CRITICAL priority"

  on_status_change:
    - action: "update_calendar"
      condition: "new_status == 'released'"

    - action: "archive"
      condition: "new_status in ['released', 'cancelled']"
      delay_days: 30

  on_blocker_added:
    - action: "recalculate_priority"
    - action: "notify"
      message: "New blocker added to release {id}: {blocker_description}"

  scheduled:
    - action: "priority_recalculation"
      frequency: "daily"
      time: "09:00"

    - action: "status_report"
      frequency: "weekly"
      day: "monday"
      time: "09:00"

# -----------------------------------------------------------------------------
# METADATA
# -----------------------------------------------------------------------------

metadata:
  calendar_name: "MAG Music Records Master Release Calendar"
  timezone: "UTC"
  fiscal_year_start: "01-01"

  id_format:
    pattern: "REL-YYYY-NNN"
    example: "REL-2025-001"
    auto_increment: true

  blocker_id_format:
    pattern: "BLK-NNN"
    example: "BLK-001"
    auto_increment: true
