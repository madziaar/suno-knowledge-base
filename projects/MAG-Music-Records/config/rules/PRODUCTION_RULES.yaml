# =============================================================================
# PRODUCTION RULES
# MAG Music Records - Production Validation Configuration
# =============================================================================
# Version: 1.0.0
# Last Updated: 2024-12-31
# Purpose: Define validation rules for all production artifacts
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL SETTINGS
# -----------------------------------------------------------------------------

global:
  version: "1.0.0"
  strict_mode: true              # Fail on any validation error
  warn_on_optional: true         # Warn if optional fields missing
  encoding: "UTF-8"
  line_endings: "LF"             # Unix-style line endings

# -----------------------------------------------------------------------------
# ARTIFACT TYPE DEFINITIONS
# -----------------------------------------------------------------------------

artifact_types:

  # ---------------------------------------------------------------------------
  # PROMPT - AI Generation Instructions
  # ---------------------------------------------------------------------------
  prompt:
    extension: ".md"
    description: "AI generation prompt for track creation"

    required_fields:
      - name: "title"
        type: "string"
        description: "Track title or working title"
        validation:
          min_length: 1
          max_length: 100
          pattern: "^[A-Za-z0-9\\s\\-\\']+$"

      - name: "genre"
        type: "string"
        description: "Primary genre classification"
        validation:
          allowed_values:
            - "hardcore drill"
            - "drill"
            - "uk drill"
            - "ny drill"
            - "trap"
            - "phonk"
            - "experimental"

      - name: "mood"
        type: "string"
        description: "Emotional tone/mood"
        validation:
          min_length: 1
          max_length: 50

      - name: "bpm_range"
        type: "string"
        description: "Target BPM range"
        validation:
          pattern: "^[0-9]{2,3}-[0-9]{2,3}$"
          example: "140-145"

      - name: "prompt_content"
        type: "text"
        description: "Main prompt instructions"
        validation:
          min_length: 100
          max_length: 4000
          required_sections:
            - "## Style"
            - "## Instrumentation"
            - "## Structure"

    optional_fields:
      - name: "reference_tracks"
        type: "list"
        description: "Reference tracks for style guidance"

      - name: "avoid"
        type: "list"
        description: "Elements to avoid in generation"

      - name: "keywords"
        type: "list"
        description: "Key descriptive words"
        max_items: 10

      - name: "notes"
        type: "text"
        description: "Additional production notes"
        max_length: 1000

    character_limits:
      total_file: 5000
      prompt_content: 4000
      title: 100
      notes: 1000

    template: "templates/track_prompt.md"

  # ---------------------------------------------------------------------------
  # LYRICS - Song Lyrics/Vocals
  # ---------------------------------------------------------------------------
  lyrics:
    extension: ".md"
    description: "Song lyrics and vocal content"

    required_fields:
      - name: "title"
        type: "string"
        description: "Track title"
        validation:
          min_length: 1
          max_length: 100

      - name: "structure"
        type: "string"
        description: "Song structure notation"
        validation:
          pattern: "^(Intro|Verse|Chorus|Bridge|Hook|Outro|Pre-Chorus|Drop|Break)(\\s*[0-9]*\\s*[-,]\\s*)*(Intro|Verse|Chorus|Bridge|Hook|Outro|Pre-Chorus|Drop|Break)(\\s*[0-9]*)?$"
          example: "Intro - Verse 1 - Chorus - Verse 2 - Chorus - Bridge - Chorus - Outro"

      - name: "lyrics_content"
        type: "text"
        description: "Full lyrics with section markers"
        validation:
          min_length: 50
          max_length: 8000
          required_markers:
            - "[Verse"
            - "[Chorus"

    optional_fields:
      - name: "language"
        type: "string"
        description: "Primary language"
        default: "English"

      - name: "explicit"
        type: "boolean"
        description: "Contains explicit content"
        default: false

      - name: "vocal_style"
        type: "string"
        description: "Vocal delivery style"
        allowed_values:
          - "rap"
          - "melodic"
          - "sung"
          - "spoken word"
          - "mixed"

      - name: "adlibs"
        type: "text"
        description: "Suggested ad-libs and vocal embellishments"
        max_length: 500

      - name: "flow_notes"
        type: "text"
        description: "Notes on rhythmic flow and delivery"
        max_length: 500

    character_limits:
      total_file: 10000
      lyrics_content: 8000
      title: 100
      adlibs: 500
      flow_notes: 500

    template: "templates/track_lyrics.md"

  # ---------------------------------------------------------------------------
  # DESCRIPTION - Platform Description
  # ---------------------------------------------------------------------------
  description:
    extension: ".md"
    description: "Track description for streaming platforms and social media"

    required_fields:
      - name: "title"
        type: "string"
        description: "Track title"
        validation:
          min_length: 1
          max_length: 100

      - name: "short_description"
        type: "text"
        description: "Short description for social media"
        validation:
          min_length: 50
          max_length: 280

      - name: "full_description"
        type: "text"
        description: "Full description for platforms"
        validation:
          min_length: 100
          max_length: 1000

    optional_fields:
      - name: "hashtags"
        type: "list"
        description: "Relevant hashtags"
        validation:
          max_items: 15
          item_pattern: "^#[A-Za-z0-9]+$"

      - name: "credits"
        type: "text"
        description: "Production and writing credits"
        max_length: 500

      - name: "call_to_action"
        type: "string"
        description: "CTA for listeners"
        max_length: 100

      - name: "platform_specific"
        type: "object"
        description: "Platform-specific descriptions"
        fields:
          spotify:
            max_length: 1000
          apple_music:
            max_length: 1000
          youtube:
            max_length: 5000
          soundcloud:
            max_length: 1000

    character_limits:
      total_file: 8000
      short_description: 280
      full_description: 1000
      credits: 500

    template: "templates/track_description.md"

  # ---------------------------------------------------------------------------
  # METADATA - Track Configuration
  # ---------------------------------------------------------------------------
  metadata:
    extension: ".yaml"
    description: "Track metadata and configuration"

    required_fields:
      - name: "track_id"
        type: "string"
        description: "Unique track identifier"
        validation:
          pattern: "^track_[0-9]{2}$"

      - name: "title"
        type: "string"
        description: "Official track title"
        validation:
          min_length: 1
          max_length: 100

      - name: "project"
        type: "string"
        description: "Parent project ID"
        validation:
          pattern: "^MAG_[A-Z]+_V[0-9]+$"

      - name: "status"
        type: "string"
        description: "Production status"
        validation:
          allowed_values:
            - "concept"
            - "in_progress"
            - "review"
            - "approved"
            - "released"

      - name: "created_date"
        type: "date"
        description: "Creation date"
        validation:
          format: "YYYY-MM-DD"

    optional_fields:
      - name: "bpm"
        type: "integer"
        description: "Track tempo"
        validation:
          min: 60
          max: 200

      - name: "key"
        type: "string"
        description: "Musical key"
        validation:
          pattern: "^[A-G](#|b)?(m|maj|min)?$"

      - name: "duration"
        type: "string"
        description: "Track duration"
        validation:
          pattern: "^[0-9]{1,2}:[0-9]{2}$"

      - name: "isrc"
        type: "string"
        description: "ISRC code"
        validation:
          pattern: "^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$"

      - name: "tags"
        type: "list"
        description: "Categorization tags"
        max_items: 20

    template: "templates/track_meta.yaml"

  # ---------------------------------------------------------------------------
  # NOTES - Production Notes
  # ---------------------------------------------------------------------------
  notes:
    extension: ".md"
    description: "Internal production notes and documentation"

    required_fields:
      - name: "title"
        type: "string"
        description: "Note title/subject"
        validation:
          min_length: 1
          max_length: 100

      - name: "content"
        type: "text"
        description: "Note content"
        validation:
          min_length: 10

    optional_fields:
      - name: "category"
        type: "string"
        description: "Note category"
        allowed_values:
          - "production"
          - "mixing"
          - "mastering"
          - "creative"
          - "technical"
          - "feedback"

      - name: "author"
        type: "string"
        description: "Note author"

      - name: "date"
        type: "date"
        description: "Note date"

      - name: "action_items"
        type: "list"
        description: "To-do items from notes"

    template: "templates/production_notes.md"

# -----------------------------------------------------------------------------
# QUALITY GATES
# -----------------------------------------------------------------------------
# Define what must pass before moving to next production stage

quality_gates:

  # Gate: Concept to In Progress
  concept_to_progress:
    name: "Concept Approval"
    description: "Requirements to start active production"

    requirements:
      - check: "prompt_exists"
        description: "Prompt file must exist"
        severity: "error"

      - check: "prompt_valid"
        description: "Prompt must pass validation"
        severity: "error"

      - check: "metadata_exists"
        description: "Metadata file must exist"
        severity: "error"

    optional:
      - check: "lyrics_draft"
        description: "Lyrics draft recommended"
        severity: "warning"

  # Gate: In Progress to Review
  progress_to_review:
    name: "Review Ready"
    description: "Requirements to submit for review"

    requirements:
      - check: "prompt_final"
        description: "Prompt must be marked as final"
        severity: "error"

      - check: "lyrics_complete"
        description: "Lyrics must be complete"
        severity: "error"

      - check: "description_exists"
        description: "Description file must exist"
        severity: "error"

      - check: "character_limits_met"
        description: "All character limits must be within bounds"
        severity: "error"

      - check: "naming_valid"
        description: "All files must follow naming conventions"
        severity: "error"

    optional:
      - check: "audio_draft"
        description: "Audio draft recommended for review"
        severity: "warning"

  # Gate: Review to Approved
  review_to_approved:
    name: "Final Approval"
    description: "Requirements for final approval"

    requirements:
      - check: "all_artifacts_complete"
        description: "All required artifacts must be complete"
        severity: "error"

      - check: "all_artifacts_valid"
        description: "All artifacts must pass validation"
        severity: "error"

      - check: "human_review_passed"
        description: "Human review must be documented"
        severity: "error"

      - check: "no_open_blockers"
        description: "No unresolved blockers"
        severity: "error"

  # Gate: Approved to Released
  approved_to_released:
    name: "Release Ready"
    description: "Requirements for release"

    requirements:
      - check: "distribution_submitted"
        description: "Distribution must be submitted"
        severity: "error"

      - check: "artwork_final"
        description: "Artwork must be finalized"
        severity: "error"

      - check: "metadata_complete"
        description: "All metadata fields populated"
        severity: "error"

      - check: "isrc_assigned"
        description: "ISRC code must be assigned"
        severity: "error"

# -----------------------------------------------------------------------------
# VALIDATION RULES
# -----------------------------------------------------------------------------

validation:

  # Run on file save
  on_save:
    - check: "file_naming"
      description: "Validate filename follows conventions"

    - check: "encoding"
      description: "Validate file encoding is UTF-8"

    - check: "required_fields"
      description: "Check all required fields present"

  # Run on commit
  on_commit:
    - check: "all_validations"
      description: "Run complete validation suite"

    - check: "character_limits"
      description: "Validate all character limits"

    - check: "cross_references"
      description: "Validate file references are valid"

  # Run daily
  scheduled:
    - check: "orphaned_files"
      description: "Find files not linked to any track"

    - check: "incomplete_tracks"
      description: "Find tracks missing required artifacts"

    - check: "stale_content"
      description: "Find content not updated in 30+ days"

# -----------------------------------------------------------------------------
# ERROR MESSAGES
# -----------------------------------------------------------------------------

error_messages:
  missing_required_field: "Required field '{field}' is missing in {file}"
  invalid_pattern: "Field '{field}' does not match required pattern: {pattern}"
  exceeds_limit: "Field '{field}' exceeds character limit: {current}/{max}"
  invalid_value: "Field '{field}' contains invalid value: {value}"
  file_not_found: "Required file not found: {file}"
  invalid_encoding: "File '{file}' is not UTF-8 encoded"
  naming_violation: "File '{file}' violates naming convention: {rule}"

# -----------------------------------------------------------------------------
# AUTOMATION
# -----------------------------------------------------------------------------

automation:

  validation_triggers:
    - event: "file_save"
      actions: ["validate_file", "update_timestamp"]

    - event: "git_pre_commit"
      actions: ["validate_all", "check_limits", "lint"]

    - event: "status_change"
      actions: ["check_gate", "notify_if_blocked"]

  reporting:
    format: "json"
    output_path: "reports/validation/"
    include_warnings: true
    include_passed: false
